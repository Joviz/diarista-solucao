<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Background circle with brand gradient -->
  <circle cx="24" cy="24" r="22" fill="url(#brandGradient)" />
  
  <!-- Calendar icon -->
  <rect x="12" y="14" width="24" height="22" rx="3" fill="white" />
  
  <!-- Calendar header -->
  <rect x="12" y="14" width="24" height="8" rx="3" fill="url(#headerGradient)" />
  
  <!-- Calendar dots (days) -->
  <circle cx="16" cy="18" r="1.5" fill="#16a34a" />
  <circle cx="24" cy="18" r="1.5" fill="#a855f7" />
  <circle cx="32" cy="18" r="1.5" fill="#16a34a" />
  
  <!-- Calendar lines -->
  <path d="M15 26h18" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15 31h18" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15 36h18" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Checkmark on today -->
  <path d="M20 22l3 3 6-6" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Sparkle for clean/cleaned -->
  <g transform="translate(34, 16)">
    <path d="M0 -4v8M-4 0h8" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-3 -3l6 6M3 -3l-6 6" stroke="#fde047" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
</svg>